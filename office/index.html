<style>

.toast.err{background:var(--bad)}
.rb{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:13px;color:var(--muted)}.rb input{padding:4px 8px;width:170px;font-size:13px}.rb button{padding:4px 10px}.rb b{color:var(--ink)}

:root{--bg:#f6f2ef;--ink:#2a1420;--muted:#7a6a70;--line:#ebe2dd;--accent:#f47a24;--chip:#f3ece8;--plum:#8e1f5c;--plum2:#f6e6ef;--deep:#4f0a2f}

function elvLogin(msg){try{localStorage.removeItem('elv_office_t')}catch(e){}
 const ov=document.createElement('div');document.body.appendChild(ov);ov.innerHTML='<div style="position:fixed;inset:0;z-index:99;overflow:auto;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,#4f0a2f,#6e1446 55%,#8e1f5c);font:15px/1.5 Inter,system-ui,sans-serif"><div style="width:min(420px,calc(100vw - 32px));background:#fff;border-radius:18px;padding:24px;display:grid;gap:12px;border-top:5px solid #f47a24;color:#2a1420"><img src="../elv-logo.png" alt="Erasmus Life" style="height:70px;justify-self:center"><h1 style="font:700 22px/1.2 Josefin Sans,Inter,sans-serif;margin:0;text-align:center;color:#4f0a2f">Rooms Office</h1><p style="color:#7a6a70;margin:0">'+(msg||'Enter your team e-mail. If it is allowed, you will receive a personal link to open the office page.')+'</p><input id="lge" type="email" placeholder="you@gmail.com" style="font:inherit;padding:10px;border:1px solid #ebe2dd;border-radius:10px"><button id="lgb" style="font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px;background:#f47a24;color:#fff;cursor:pointer">Send me the link</button><p id="lgr" style="color:#7a6a70;margin:0"></p><div style="border-top:1px solid #ebe2dd;padding-top:12px;display:grid;gap:8px"><span style="color:#7a6a70;font-size:13px">Already have the link? (app on the home screen) Copy the link from the e-mail and paste it here:</span><input id="lgp" placeholder="https://erasmuslifevalencia.github.io/rooms/office/?t=…" style="font:inherit;padding:10px;border:1px solid #ebe2dd;border-radius:10px"><button id="lgo" style="font:inherit;font-weight:700;border:1px solid #f47a24;border-radius:10px;padding:10px;background:#fff;color:#f47a24;cursor:pointer">Open with this link</button></div></div></div>';
 document.getElementById('lgo').onclick=()=>{const v=document.getElementById('lgp').value.trim();const m=v.match(/[?&]t=([^&#s]+)/);const t=m?decodeURIComponent(m[1]):(/^[w-]+.[w-]+$/.test(v)?v:'');if(!t){document.getElementById('lgr').textContent='This is not the office link from the e-mail.';return}try{localStorage.setItem('elv_office_t',t)}catch(e){}location.href=location.pathname+'?t='+encodeURIComponent(t)};
 document.getElementById('lgb').onclick=()=>{const e=document.getElementById('lge').value.trim();if(!e)return;const b=document.getElementById('lgb');b.disabled=true;
  elvCall('officeLogin',[e]).then(()=>{document.getElementById('lgr').textContent='If this address is on the team list, the link is in its inbox now (check spam too).';b.disabled=false})
  .catch(()=>{document.getElementById('lgr').textContent='Something went wrong, try again.';b.disabled=false})}}

 .then(r=>{if(!r||!r.ok){const m=(r&&r.error)||'Something went wrong.';if(/sign-in link has expired|not valid/i.test(m)&&fn!=='officeLogin'&&ELV_TOKEN){elvLogin('Your sign-in link has expired. Enter your team e-mail to get a new one.')}throw new Error(m)}

if(!ELV_TOKEN)document.addEventListener('DOMContentLoaded',()=>elvLogin());
</script>
</head><body>
<header class="top"><div class="in"><img src="https://erasmuslifevalencia.github.io/rooms/elv-logo.png" alt="Erasmus Life"><div><b class="ht">Rooms Office</b><div class="hs">Bookings, contracts and deposits · <span id="sum"></span></div></div><span class="u"><span id="uname"></span><a id="ledger" class="hb" target="_blank">Ledger ↗</a></span></div></header><div class="stripe"></div>
<nav id="tabs"></nav>
<main id="main"><p class="empty">Loading…</p></main>
<div class="toast" id="toast"></div>
<script>
const TOKEN=ELV_TOKEN;let D=null,TAB='todo',Q='',RB='',SF='',BSEL=new Set(),BF='',BT='',BRES='',CONV=null;
const isIdl=b=>b.status==='RESERVED'&&/^idealista/i.test(b.source||'');
const isTodo=b=>TODO.includes(b.status)||isIdl(b);
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const lab=m=>m?M[+m.slice(5,7)-1]+' '+m.slice(2,4):'?';
const add=(m,n)=>{let y=+m.slice(0,4),k=+m.slice(5,7)-1+n;y+=Math.floor(k/12);k=((k%12)+12)%12;return y+'-'+String(k+1).padStart(2,'0')};
const span=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7))-(+a.slice(5,7))+1;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function toast(t,err){const x=$('toast');x.textContent=t;x.className='toast'+(err?' err':'');x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',err?8000:4000)}
function call(fn,...a){return new Promise((ok,ko)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>ko(e&&e.message||String(e)))[fn](TOKEN,...a))}
async function load(){try{D=await call('officeData');$('ledger').href=D.ledgerUrl;render()}catch(e){$('main').innerHTML='<p class="empty">'+esc(e)+'</p>'}}
const flag=cc=>cc&&cc.length===2&&cc!=='XK'?String.fromCodePoint(...[...cc].map(ch=>127397+ch.charCodeAt(0))):'';
const flatName=id=>{const f=D.flats.find(x=>x.id===id);return f?f.name:id};
const TODO=['REQUEST','CONTRACT SENT','SIGNED'];
const ACT={REQUEST:[['accept','Accept · send contract','p'],['reserve','Hold (no e-mail)',''],['reject','Reject','r']],
 RESERVED:[['accept','Send contract','p'],['cancel','Cancel','r']],
 'CONTRACT SENT':[['signed','Signed on paper',''],['paid','Deposit received','g'],['cancel','Cancel','r']],
 SIGNED:[['paid','Deposit received','g'],['cancel','Cancel','r']],
 EXPIRED:[['accept','Send contract again','p'],['signed','Signed on paper',''],['cancel','Cancel','r']],
 CONFIRMED:[['cancel','Cancel booking','r']]};
const HELP={accept:'The contract is generated and e-mailed to the student.',reject:'The student gets a polite e-mail. Optional: write a personal message in the box, it is added to the e-mail.',reserve:'The room is blocked, no e-mail is sent.',
 signed:'The IBAN e-mail is sent to the student.',paid:'The tenant is created in the Tenants tab. Booking confirmed.',cancel:'The room becomes free again (if the tenant was already created, it is deactivated in the Tenants tab). No e-mail to the student.'};
function tabs(){const n=D.bookings.filter(isTodo).length;
 $('tabs').innerHTML=[['todo','To do',n],['new','New booking'],['block','Block rooms'],['all','All bookings'],['grid','Occupancy']].map(([k,t,c])=>'<button class="'+(TAB===k?'on':'')+'" data-t="'+k+'">'+t+(c?'<span class="n">'+c+'</span>':'')+'</button>').join('');
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;CONV=null;render()});
 $('sum').textContent=n+' to do';}
function card(b){const st=b.status;const idl=isIdl(b);let acts=idl?[]:(ACT[st]||[]);if(st==='EXPIRED'&&b.depositProofUrl)acts=[['paid','Deposit received','g']].concat(acts);
 const links=[b.contractPdfUrl&&'<a target="_blank" href="'+esc(b.contractPdfUrl)+'">contract PDF</a>',b.contractEnPdfUrl&&'<a target="_blank" href="'+esc(b.contractEnPdfUrl)+'">EN</a>',b.signedFileUrl&&b.signedFileUrl.split('\n').map((u,i)=>'<a target="_blank" href="'+esc(u)+'">signed '+(i+1)+'</a>').join(' '),
  b.depositProofUrl&&b.depositProofUrl.split('\n').map((u,i)=>'<a target="_blank" href="'+esc(u)+'" style="font-weight:700;color:#1f7a45">deposit proof '+(i+1)+'</a>').join(' ')].filter(Boolean).join(' · ');
 return '<div class="card" id="c'+esc(b.id)+'"><div><div class="top"><span class="nm">'+esc(b.name)+'</span><span class="st '+esc(st.split(' ')[0])+'">'+esc(st)+'</span>'+
 '<span class="meta">'+esc(b.id)+' · '+esc(b.source)+'</span></div>'+
 '<div class="meta"><b style="color:#1d1b18">'+esc(flatName(b.flatId))+' · R'+esc(b.room)+'</b><span>'+lab(b.from)+' → '+lab(b.to)+'</span>'+
 (b.gender?'<span>'+esc(b.gender)+'</span>':'')+(b.nationality?'<span>'+esc(b.nationality)+'</span>':'')+
 (b.email?'<span>'+esc(b.email)+'</span>':'<span style="color:#b3261e">no e-mail</span>')+(b.phone?'<span>'+esc(b.phone)+'</span>':'')+
 '<span>'+esc(b.rent)+'+'+esc(b.gastos)+(+b.cleaning?'+'+esc(b.cleaning):'')+' € · deposit '+esc(b.deposit)+' €</span>'+

 (f.missing.length?'<div class="warnbox">Before sending a contract for this flat, fill in FlatSetup: '+f.missing.join(', ')+'.</div>':'')+
 '<div class="g2"><label>Full name (as on ID)<input id="nname"></label><label>Gender<select id="ngender"><option value="">Choose…</option><option'+(f.gender==='Girls only'?' selected':'')+'>Girl</option><option'+(f.gender==='Boys only'?' selected':'')+'>Boy</option></select></label></div>'+
 '<div class="g3"><label>E-mail<input id="nemail" type="email"></label><label>Phone / WhatsApp<input id="nphone"></label><label>Nationality<input id="nnat"></label></div>'+
 '<div class="g2"><label>ID document<select id="nidt"><option value="PASSPORT">Passport</option><option value="DNI">National ID card</option><option value="NIE">NIE</option></select></label><label>ID number<input id="nid"></label></div>'+
 '<div class="g2"><label>Monthly rent on idealista (€) – goes in the contract<input id="nrent" type="number" min="100" max="3000" step="1" value="'+esc(r?r.rent:'')+'"></label><div class="meta" style="align-self:end">Utilities '+(r?r.gastos:'?')+' €'+(r&&r.cleaning?' + cleaning '+r.cleaning+' €':'')+' are added as usual. Deposit = 1 month (rent + utilities'+(r&&r.cleaning?' + cleaning':'')+').</div></div>'+
 '<div class="g2"><label>Rented by (employee)<input id="nrb" list="staff" placeholder="employee name" value="'+esc(b.rentedBy||'')+'"></label><label>Note (optional)<textarea id="nmsg" rows="1"></textarea></label></div>'+
 '<div class="acts" style="justify-content:flex-start"><button class="a p" id="cv-accept">Save + send contract now</button><button class="a" id="cv-save">Save details only (room stays held)</button><button class="a" id="cv-back">Back</button></div>'+
 '<p class="meta">The dates are the ones blocked from idealista (whole months). Then it is a normal booking: signature, deposit, Tenants tab, gastos.</p></div>';
 $('cv-back').onclick=()=>{CONV=null;TAB='todo';render()};
 ['accept','save'].forEach(k=>$('cv-'+k).onclick=async()=>{const fm={name:$('nname').value.trim(),gender:$('ngender').value,email:$('nemail').value.trim(),phone:$('nphone').value.trim(),
  nationality:$('nnat').value.trim(),idType:$('nidt').value,idNumber:$('nid').value.trim(),message:$('nmsg').value.trim(),rentedBy:$('nrb').value.trim(),rent:$('nrent').value.trim()};
  const bs=document.querySelectorAll('.form button');bs.forEach(x=>x.disabled=true);
  try{const r=await call('officeConvertIcal',b.id,fm,k==='accept'?'accept':'save');const bad=/ERROR|Not possible|No IBAN|missing|incomplete|choose/i.test(r.note||'');
   toast(r.status+' · '+(r.note||'').replace(/^\[[^\]]*\]\s*/,''),bad);CONV=null;await load();TAB=bad?'all':'todo';render()}
  catch(e){toast(e,true);bs.forEach(x=>x.disabled=false)}})}
function busyIn(r,f,t){return r.occ.filter(o=>o.from<=t&&o.to>=f)}
function renderBlock(){const months=[];for(let x=D.start;x<=D.end;x=add(x,1))months.push(x);
 if(!BF){BF=months.find(x=>x.slice(5)==='07')||months[0];BT=add(BF,1)}if(BT<BF)BT=BF;
 const mo=v=>months.map(x=>'<option value="'+x+'"'+(x===v?' selected':'')+'>'+lab(x)+'</option>').join('');
 let h='<div class="form" style="max-width:none"><div class="g3"><label>From<select id="bf">'+mo(BF)+'</select></label><label>To (last month)<select id="bt">'+mo(BT)+'</select></label><label>Label<input id="bl" value="BLOCKED" maxlength="60"></label></div>'+
 '<p class="meta" style="margin:0">Tick the rooms to close for these months (whole months). Rooms already taken on one of these months are shown in red and cannot be ticked. No e-mail is sent; the rooms disappear from the public page for this period.</p>'+
 '<div class="acts" style="justify-content:flex-start"><button class="a" id="ball">Select all free rooms</button><button class="a" id="bnone">Clear selection</button><button class="a p" id="bgo">Block selected rooms (0)</button></div></div>'+
 (BRES?'<div class="res">'+BRES+'</div>':'')+'<div style="margin-top:10px">';
 D.flats.forEach(f=>{h+='<div class="bf"><label class="bfh"><input type="checkbox" data-fall="'+esc(f.id)+'"> <b>'+esc(f.name)+'</b><span class="meta">'+f.rooms.length+' rooms</span></label><div class="brs">';
  f.rooms.forEach(r=>{const k=f.id+'#'+r.room,busy=busyIn(r,BF,BT);if(busy.length)BSEL.delete(k);
   h+=busy.length?'<label class="br busy" title="'+esc(busy.map(o=>o.name+' '+lab(o.from)+'–'+lab(o.to)).join(', '))+'"><input type="checkbox" disabled> R'+esc(r.room)+' · '+esc(busy[0].name.split(' ')[0])+'</label>'
   :'<label class="br'+(BSEL.has(k)?' sel':'')+'"><input type="checkbox" data-k="'+esc(k)+'"'+(BSEL.has(k)?' checked':'')+'> R'+esc(r.room)+'</label>'});
  h+='</div></div>'});
 h+='</div>';
 const groups={};D.bookings.filter(b=>b.status==='RESERVED'&&/^Office block/.test(b.source)).forEach(b=>{const g=b.name+'|'+b.from+'|'+b.to;(groups[g]=groups[g]||[]).push(b)});
 const gk=Object.keys(groups);
 h+='<h3 style="margin:20px 0 8px">Currently blocked</h3>'+(gk.length?gk.map((g,i)=>{const l=groups[g];return '<div class="card"><div><div class="top"><span class="nm">'+esc(l[0].name)+'</span><span class="st RESERVED">'+lab(l[0].from)+' → '+lab(l[0].to)+'</span><span class="meta">'+l.length+' room(s)</span></div>'+
  '<div class="meta">'+l.map(b=>esc(flatName(b.flatId))+' R'+esc(b.room)).join(' · ')+'</div></div><div class="acts"><button class="a r" data-ub="'+i+'">Unblock all ('+l.length+')</button></div></div>'}).join(''):'<p class="meta">Nothing blocked with this tool.</p>');
 $('main').innerHTML=h;
 const cnt=()=>{$('bgo').textContent='Block selected rooms ('+BSEL.size+')';$('bgo').classList.remove('sure')};cnt();
 $('bf').onchange=e=>{BF=e.target.value;if(BT<BF)BT=BF;BRES='';renderBlock()};$('bt').onchange=e=>{BT=e.target.value;if(BT<BF)BF=BT;BRES='';renderBlock()};
 document.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{c.checked?BSEL.add(c.dataset.k):BSEL.delete(c.dataset.k);c.parentNode.classList.toggle('sel',c.checked);cnt()});
 document.querySelectorAll('[data-fall]').forEach(c=>{const ks=[...document.querySelectorAll('[data-k^="'+c.dataset.fall+'#"]')];c.checked=ks.length&&ks.every(x=>x.checked);
  c.onchange=()=>{ks.forEach(x=>{x.checked=c.checked;c.checked?BSEL.add(x.dataset.k):BSEL.delete(x.dataset.k);x.parentNode.classList.toggle('sel',c.checked)});cnt()}});
 $('ball').onclick=()=>{document.querySelectorAll('[data-k]').forEach(x=>BSEL.add(x.dataset.k));renderBlock()};$('bnone').onclick=()=>{BSEL.clear();renderBlock()};
 $('bgo').onclick=async()=>{const b=$('bgo');if(!BSEL.size)return toast('Tick at least one room.',true);
  if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='Confirm: block '+BSEL.size+' room(s) '+lab(BF)+' → '+lab(BT)+'?';return}
  b.disabled=true;b.textContent='Working…';
  try{const rooms=[...BSEL].map(k=>{const i=k.lastIndexOf('#');return{flatId:k.slice(0,i),room:k.slice(i+1)}});
   const r=await call('officeBlock',rooms,BF,BT,$('bl').value);
   BRES='<b>'+r.blocked.length+' room(s) blocked</b> '+lab(BF)+' → '+lab(BT)+'.'+(r.skipped.length?'<br><span style="color:#b3261e">Not blocked ('+r.skipped.length+'): '+r.skipped.map(s=>esc(s.flat+' R'+s.room+' – '+s.reason)).join('; ')+'</span>':'');
   toast(r.blocked.length+' room(s) blocked'+(r.skipped.length?', '+r.skipped.length+' skipped':''),!!r.skipped.length);BSEL.clear();await load()}
  catch(e){toast(e,true);b.disabled=false;cnt()}};
 document.querySelectorAll('[data-ub]').forEach(x=>x.onclick=async()=>{const l=groups[gk[+x.dataset.ub]];
  if(!x.classList.contains('sure')){x.classList.add('sure');x.textContent='Confirm unblock '+l.length+'?';return}
  x.disabled=true;x.textContent='Working…';
  try{const r=await call('officeUnblock',l.map(b=>b.id));BRES='<b>'+r.done+' room(s) unblocked.</b>';toast(r.done+' room(s) free again');await load()}catch(e){toast(e,true);x.disabled=false}})}
function curFlat(){return D.flats.find(f=>f.id===$('nf').value)}
function curRoom(){const f=curFlat();return f&&f.rooms.find(r=>r.room===$('nr').value)}
function fits(r,m){return r.windows.some(w=>w.from<=m&&m<=w.to&&span(m,w.open?D.end:w.to)>=r.minMonths)}
function fillRooms(){const f=curFlat();$('nr').innerHTML=f?f.rooms.map(r=>{const w=r.windows[0];return '<option value="'+esc(r.room)+'">R'+esc(r.room)+' · '+(r.rent+r.gastos+r.cleaning)+'€ · '+(w?'free from '+lab(w.from):'full')+'</option>'}).join(''):'';
 const g=$('ngender');if(f){g.value=f.gender==='Girls only'?'Girl':f.gender==='Boys only'?'Boy':g.value}fillFrom()}
function fillFrom(){const r=curRoom(),f=curFlat();const starts=[];if(r)r.windows.forEach(w=>{for(let x=w.from;x<=w.to;x=add(x,1))if(fits(r,x))starts.push(x)});
 $('nfrom').innerHTML=starts.map(x=>'<option value="'+x+'">'+lab(x)+'</option>').join('')||'<option value="">no free dates</option>';
 $('ninfo').innerHTML=r?'<div class="info">Rent '+r.rent+' € + utilities '+r.gastos+' €'+(r.cleaning?' + cleaning '+r.cleaning+' €':'')+' · deposit '+r.deposit+' €'+(r.minMonths>1?' · <b>min '+r.minMonths+' months</b>':'')+'</div>'+
 (f.missing.length?'<div class="warnbox" style="margin-top:6px">Before sending a contract for this flat, fill in FlatSetup: '+f.missing.join(', ')+'.</div>':''):'';fillTo()}
function fillTo(){const r=curRoom(),x=$('nfrom').value;if(!r||!x){$('nto').innerHTML='';return}const w=r.windows.find(w=>w.from<=x&&x<=w.to);const last=w.open?D.end:w.to;const ends=[];
 for(let e=add(x,r.minMonths-1);e<=last;e=add(e,1))ends.push(e);$('nto').innerHTML=ends.map(e=>'<option value="'+e+'">'+lab(e)+'</option>').join('');
 $('nto').value=ends.find(e=>['01','06','07'].includes(e.slice(5)))||ends[0]||''}
async function create(mode){const f={flatId:$('nf').value,room:$('nr').value,from:$('nfrom').value,to:$('nto').value,name:$('nname').value.trim(),gender:$('ngender').value,
 email:$('nemail').value.trim(),phone:$('nphone').value.trim(),nationality:$('nnat').value.trim(),idType:$('nidt').value,idNumber:$('nid').value.trim(),message:$('nmsg').value.trim(),rentedBy:$('nrb').value.trim()};
 const bs=document.querySelectorAll('.form button');bs.forEach(b=>b.disabled=true);
 try{const r=await call('officeCreate',f,mode);const bad=/ERROR|Not possible|No IBAN|missing|incomplete|choose/i.test(r.note||'');
  toast(r.status+' · '+(r.note||'').replace(/^\[[^\]]*\]\s*/,''),bad);await load();TAB=bad?'all':'todo';render()}
 catch(e){toast(e,true);bs.forEach(b=>b.disabled=false)}}
load();setInterval(()=>{const a=document.activeElement;if(TAB!=='new'&&TAB!=='block'&&!(a&&a.classList&&a.classList.contains('rbi'))&&!(a&&a.tagName==='TEXTAREA'))load()},120000);
</script></body></html>
